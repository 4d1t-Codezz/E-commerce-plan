<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Daybreak HQ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login" class="login">
  <form id="loginForm" class="login-box" autocomplete="on">
    <div class="brand">Daybreak <span>HQ</span></div>
    <p class="muted">Research and numbers for the store. Sign in to continue.</p>
    <label for="who">Who are you</label>
    <select id="who" name="who">
      <option>Aditya</option>
      <option>Jasper</option>
    </select>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">Sign in</button>
    <p id="loginErr" class="err" hidden></p>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand">Daybreak <span>HQ</span></div>
      <nav id="nav" class="nav"></nav>
      <div class="me"><span id="meName"></span> · <button type="button" class="link" id="logout">Sign out</button></div>
    </div>
  </header>
  <main id="view" class="wrap"></main>
  <footer class="wrap foot">
    <span class="tag ver">Verified</span> from an API or checked by hand
    <span class="tag est">Estimate</span> from research notes, needs checking
    <span class="tag ai">Predicted</span> scored or suggested by the model
    <span class="tag demo">Demo</span> simulated, not real store data
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
